spring.application.name=prescription-Management-REST-API

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/prescription_management_system}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# 'validate' requires the schema to already exist (e.g. via Flyway/Liquibase or manual DDL).
# Change to 'update' for local development if you don't have a migration tool set up.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
