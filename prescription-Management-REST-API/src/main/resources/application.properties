
spring.application.name=prescription-Management-REST-API

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/prescription_management_system}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Security (local testing credentials) ─────────────────────────────────────
spring.security.user.name=admin
spring.security.user.password=admin

# ── Error response hardening ──────────────────────────────────────────────────
# Never expose stack traces, exception class names, or raw DB messages to clients.
# GlobalExceptionHandler handles all structured errors; these settings are a
# safety net for any errors that bypass it (e.g. early filter exceptions).
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
