
spring.application.name=prescription-Management-REST-API

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/prescription_management_system}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Fixed credentials for local testing (used in test-data/curl-commands.txt)
spring.security.user.name=admin
spring.security.user.password=admin
