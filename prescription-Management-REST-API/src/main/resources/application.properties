
spring.application.name=prescription-Management-REST-API

# ── DataSource (MySQL) ────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/prescription_management_system}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# 'validate' = Hibernate checks schema matches entities (Flyway owns DDL, not Hibernate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Java 21 Virtual Threads (Project Loom) ───────────────────────────────────
# Uses lightweight virtual threads for all web request handling and async tasks.
# Dramatically improves throughput under I/O-bound workloads at no code change.
spring.threads.virtual.enabled=true

# ── Error response hardening ──────────────────────────────────────────────────
# Never expose stack traces, exception class names, or raw DB messages to clients.
# GlobalExceptionHandler handles all structured errors; these settings are a
# safety net for any errors that bypass it (e.g. early filter-chain exceptions).
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

# ── Security ──────────────────────────────────────────────────────────────────
# Accounts are stored in the app_users DB table (created by V4 migration).
# Default accounts (admin / doctor1) are seeded by DataInitializer on startup.
# DO NOT use spring.security.user.* — a custom UserDetailsService is active.
